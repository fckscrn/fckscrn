# fckscrn on one VPS: the app + Caddy (automatic HTTPS). Run from this folder:
#   docker compose up -d --build
services:
  fckscrn:
    build: ..
    restart: unless-stopped
    env_file: ../server/.env.local       # secrets live only on the server
    environment:
      DATA_DIR: /data
      PUBLIC_URL: https://${DOMAIN:-fckscrn.com}   # canonical links, sitemap, og:image
      SEARCH_INDEX: ${SEARCH_INDEX:-on}              # off on a test server
    volumes:
      - fckscrn-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-fckscrn.com}
      REDIRECTS: ${REDIRECTS:-www.fckscrn.com, fckscrn.cz, www.fckscrn.cz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - fckscrn

volumes:
  fckscrn-data:
  caddy-data:
